server:
  port: 9091

spring:
  application:
    name: data-pump-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: NON_NULL

management:
  security:
    enabled: false

  endpoints:
    web:
      base-path: /
      path-mapping:
        health: healthcheck
      exposure:
        include:
          - info
          - health
          - httptrace
          - env
          - threaddump
          - metrics

wakeup-message:
  enabled: ${WAKEUP_MESSAGE_ENABLED:false}
  cron: ${WAKEUP_MESSAGE_CRON:0 0 7 * * *}
  zone: ${WAKEUP_MESSAGE_ZONE:America/Sao_Paulo}
  to: ${WAKEUP_MESSAGE_TO:+5521976100589}
  from: ${WAKEUP_MESSAGE_FROM:}
  body: ${WAKEUP_MESSAGE_BODY:Bom dia! Hora de acordar!}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
